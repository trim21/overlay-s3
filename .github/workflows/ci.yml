name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Start silo S3 backend
        run: |
          docker run -d --name silo -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin-secret \
            docker.io/pgsty/silo:latest server /data
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:9000/minio/health/live" >/dev/null; then
              echo "silo ready"
              exit 0
            fi
            sleep 2
          done
          echo "silo failed to become ready"
          docker logs silo 2>&1 | tail -50
          exit 1

      - name: Build and vet
        run: go build ./... && go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests against real S3
        run: go test -run TestIntegration -v ./...
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin-secret
          S3_TEST_REGION: us-east-1

      - name: Install mc
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc --version

      - name: Start overlay-s3 gateway
        run: |
          go build -o overlay-s3 .
          ./overlay-s3 \
            -listen 127.0.0.1:8080 \
            -overlay-endpoint http://127.0.0.1:9000 \
            -overlay-region us-east-1 \
            -overlay-access-key minioadmin \
            -overlay-secret-key minioadmin-secret \
            -overlay-bucket overlay-data \
            -overlay-prefix gateway \
            -baseline-endpoint http://127.0.0.1:9000 \
            -baseline-region us-east-1 \
            -baseline-access-key minioadmin \
            -baseline-secret-key minioadmin-secret \
            -auth-key demo \
            -auth-secret demo-secret \
            >/tmp/overlay-s3.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then
              echo "gateway ready"
              exit 0
            fi
            sleep 1
          done
          echo "gateway failed to become ready"
          cat /tmp/overlay-s3.log
          exit 1

      - name: mc end-to-end (ls / cp / cat)
        run: |
          set -euo pipefail
          mc alias set gw http://127.0.0.1:8080 demo demo-secret
          mc alias set silo http://127.0.0.1:9000 minioadmin minioadmin-secret

          # seed a read-only baseline bucket directly on silo
          mc mb silo/baseline-data
          printf 'baseline-content' >/tmp/baseline.txt
          mc cp /tmp/baseline.txt silo/baseline-data/remote.txt

          # create a client-visible bucket through the gateway
          mc --debug mb gw/demo

          # upload through the gateway: lands in the overlay
          printf 'hello-from-mc' >/tmp/up.txt
          mc --debug cp /tmp/up.txt gw/demo/up.txt

          # listing through the gateway shows the overlay write
          mc ls gw/demo | grep 'up\.txt'

          # cp into a bucket that was never created: the location
          # preflight must succeed and the write must land in the overlay
          mc cp /tmp/up.txt gw/never-created/up.txt
          test "$(mc cat gw/never-created/up.txt)" = "hello-from-mc"

          # download the object back
          mc cp gw/demo/up.txt /tmp/down.txt
          diff /tmp/up.txt /tmp/down.txt

          # read fallback: a baseline object is served through the gateway
          test "$(mc cat gw/baseline-data/remote.txt)" = "baseline-content"

          # shadow semantics: writing a baseline key via the gateway only
          # touches the overlay; the baseline copy stays untouched
          printf 'shadowed' >/tmp/shadow.txt
          mc cp /tmp/shadow.txt gw/baseline-data/remote.txt
          test "$(mc cat gw/baseline-data/remote.txt)" = "shadowed"
          test "$(mc cat silo/baseline-data/remote.txt)" = "baseline-content"

          # multipart upload through the gateway: mc auto-splits objects
          # larger than the default part size into a multipart upload
          head -c $((100 * 1024 * 1024)) /dev/urandom >/tmp/big.bin
          mc cp /tmp/big.bin gw/demo/big.bin
          mc cp gw/demo/big.bin /tmp/big-down.bin
          cmp /tmp/big.bin /tmp/big-down.bin

      - name: Print silo logs
        if: failure()
        run: docker logs silo 2>&1 | tail -200

      - name: Print overlay-s3 gateway logs
        if: failure()
        run: cat /tmp/overlay-s3.log 2>/dev/null | tail -200 || true
